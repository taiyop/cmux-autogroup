name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh jq git

      - name: Check zsh syntax
        run: zsh -n cmux-autogroup.plugin.zsh

      - name: Run unit tests
        run: zsh tests/test_autogroup.zsh
