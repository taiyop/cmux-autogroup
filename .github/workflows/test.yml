name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bash zsh fish jq git

      - name: Check syntax across shells
        run: |
          bash -n bin/cmux-autogroup
          bash -n init/cmux-autogroup.bash
          zsh -n cmux-autogroup.plugin.zsh
          if command -v fish >/dev/null 2>&1; then fish -n init/cmux-autogroup.fish; fi

      - name: Run unit and wrapper tests
        run: bash tests/run_tests.bash
